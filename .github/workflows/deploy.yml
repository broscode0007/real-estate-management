name: 🚀 Deploy to EC2

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u broscode0007 \
              --password-stdin

            echo "Pulling latest image..."
            docker pull ghcr.io/broscode0007/real-estate-management:latest

            echo "Stopping old backend..."
            docker stop realestate-backend || true
            docker rm realestate-backend || true

            echo "Starting backend..."
            docker run -d \
              --name realestate-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              ghcr.io/broscode0007/real-estate-management:latest

            echo "Cleaning unused images..."
            docker image prune -af || true

            echo "Deployment completed."