name: 🚀 Build & Deploy

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/broscode0007/real-estate-management:latest .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/broscode0007/real-estate-management:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u broscode0007 \
              --password-stdin

            echo "Pulling latest image..."
            docker pull ghcr.io/broscode0007/real-estate-management:latest

            echo "Stopping old backend..."
            docker stop realestate-backend || true
            docker rm realestate-backend || true

            echo "Starting new backend..."
            docker run -d \
              --name realestate-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              ghcr.io/broscode0007/real-estate-management:latest

            echo "Cleaning unused images..."
            docker image prune -af || true