version: '3.8'

services:
  # 1. Your Spring Boot Real Estate App Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realestate-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    depends_on:
      - prometheus

  # 2. Prometheus (Collects the Backend Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: metrics-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  # 3. Grafana (Visualizes the Metrics on Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: dashboard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Default local password
    restart: unless-stopped