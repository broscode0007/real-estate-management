info:
  name: syncBuyer
  type: http
  seq: 1
  tags:
    - buyer-auth-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/buyers/auth/sync"
  auth:
    type: bearer
    token: "{{buyer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/buyers/auth/sync"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "firebaseUid": "",
            "email": "",
            "displayName": "",
            "profilePictureUrl": "",
            "emailVerified": false,
            "active": false,
            "deleted": false,
            "profileCompleted": false
          }
