info:
  name: isWishlisted
  type: http
  seq: 3
  tags:
    - wishlist-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/buyers/wishlist/{{buyer_property_id}}/exists"
  auth:
    type: bearer
    token: "{{buyer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/buyers/wishlist/:propertyId/exists"
      method: GET
      params:
        - name: propertyId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: "false"
