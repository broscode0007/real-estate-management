info:
  name: removeDeviceToken
  type: http
  seq: 3
  tags:
    - device-token-controller

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/device-tokens/{{buyer_fcm_token}}"
  auth:
    type: bearer
    token: "{{buyer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/device-tokens/:fcmToken"
      method: DELETE
      params:
        - name: fcmToken
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
