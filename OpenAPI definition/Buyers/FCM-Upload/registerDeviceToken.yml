info:
  name: registerDeviceToken
  type: http
  seq: 1
  tags:
    - device-token-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/device-tokens/register"
  body:
    type: json
    data: |-
      {
        "fcmToken": "fcm_test_token_android_123456789",
        "platform": "ANDROID",
        "deviceName": "Samsung Galaxy S23"
      }
  auth:
    type: bearer
    token: "{{buyer_token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const body = req.getBody();

        bru.setGlobalEnvVar(
            "buyer_fcm_token",
            body.fcmToken
        );

        console.log("Saved FCM token:", body.fcmToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/device-tokens/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "fcmToken": "",
            "platform": "",
            "deviceName": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": "",
            "firebaseUid": "",
            "platform": "",
            "deviceName": "",
            "active": false,
            "lastSeenAt": "",
            "createdAt": ""
          }
