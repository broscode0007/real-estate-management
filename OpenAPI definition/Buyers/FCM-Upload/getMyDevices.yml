info:
  name: getMyDevices
  type: http
  seq: 2
  tags:
    - device-token-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/device-tokens"
  auth:
    type: bearer
    token: "{{buyer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/device-tokens"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          [
            {
              "id": "",
              "firebaseUid": "",
              "platform": "",
              "deviceName": "",
              "active": false,
              "lastSeenAt": "",
              "createdAt": ""
            }
          ]
