info:
  name: createReservation
  type: http
  seq: 2
  tags:
    - reservation-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/buyers/reservations"
  body:
    type: json
    data: |-
      {
        "propertyId": "{{buyer_property_id}}",
        "reservationType": "NORMAL",
        "notes": "I need this"
      }
  auth:
    type: bearer
    token: "{{buyer_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setGlobalEnvVar("buyer_reservation_id", body.id);

        console.log("Saved token");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/buyers/reservations"
      method: POST
      body:
        type: json
        data: |-
          {
            "propertyId": "",
            "reservationType": "IMMEDIATE",
            "notes": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": "",
            "propertyId": "",
            "buyerFirebaseUid": "",
            "agentFirebaseUid": "",
            "reservationType": "IMMEDIATE",
            "status": "PENDING_PAYMENT",
            "amountPaid": 0,
            "paymentId": "",
            "expiresAt": "",
            "notes": "",
            "createdAt": "",
            "updatedAt": ""
          }
