info:
  name: getProfile
  type: http
  seq: 1
  tags:
    - buyer-profile-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/buyers/profile"
  auth:
    type: bearer
    token: "{{buyer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/buyers/profile"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
