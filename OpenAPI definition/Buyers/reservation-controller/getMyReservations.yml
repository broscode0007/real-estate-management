info:
  name: getMyReservations
  type: http
  seq: 1
  tags:
    - reservation-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/buyers/reservations"
  auth:
    type: bearer
    token: "{{buyer_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/buyers/reservations"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          [
            {
              "id": "",
              "propertyId": "",
              "buyerFirebaseUid": "",
              "agentFirebaseUid": "",
              "reservationType": "IMMEDIATE",
              "status": "PENDING_PAYMENT",
              "amountPaid": 0,
              "paymentId": "",
              "expiresAt": "",
              "notes": "",
              "createdAt": "",
              "updatedAt": ""
            }
          ]
