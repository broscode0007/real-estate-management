info:
  name: createReservation
  type: http
  seq: 2
  tags:
    - reservation-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/buyers/reservations"
  body:
    type: json
    data: |-
      {
        "propertyId": "",
        "reservationType": "IMMEDIATE",
        "notes": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
