    description: OK
    request:
      url: "{{baseUrl}}/api/v1/buyers/reservations"
      method: POST
      body:
        type: json
        data: |-
          {
            "propertyId": "",
            "reservationType": "IMMEDIATE",
            "notes": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": "",
            "propertyId": "",
            "buyerFirebaseUid": "",
            "agentFirebaseUid": "",
            "reservationType": "IMMEDIATE",
            "status": "PENDING_PAYMENT",
            "amountPaid": 0,
