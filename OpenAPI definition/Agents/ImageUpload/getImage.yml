info:
  name: getImage
  type: http
  seq: 2
  tags:
    - image-controller

http:
  method: GET
  url: "{{baseUrl}}/images/{{img_id}}"
  auth:
    type: bearer
    token: "{{agent_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/images/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: ""
