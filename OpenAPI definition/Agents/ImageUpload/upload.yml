info:
  name: upload
  type: http
  seq: 1
  tags:
    - image-controller

http:
  method: POST
  url: "{{baseUrl}}/images"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /home/koushik/Pictures/IMG-20240310-WA0017.jpg
  auth:
    type: bearer
    token: "{{agent_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setGlobalEnvVar("agent_img_id", body.id);

        console.log("Saved ID");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/images"
      method: POST
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value: []
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": "",
            "url": ""
          }
