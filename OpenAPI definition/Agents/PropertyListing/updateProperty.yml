info:
  name: updateProperty
  type: http
  seq: 4
  tags:
    - property-controller

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/agents/properties/{{agent_property_id}}"
  headers:
    - name: Authorization
      value: ""
  body:
    type: json
    data: |-
      {
        "title": "Luxury Villa Near Anna Nagar Metro",
        "description": "Recently renovated villa with modern interiors",

        "propertyType": "VILLA",
        "listingType": "SALE",
        "status": "ACTIVE",

        "expectedPrice": 9200000,
        "startPrice": 8500000,
        "maxPrice": 9500000,

        "address": "12 Anna Nagar West",
        "city": "Chennai",
        "district": "Chennai",
        "state": "Tamil Nadu",
        "country": "India",
        "postalCode": "600040",

        "bedrooms": 4,
        "bathrooms": 4,
        "parkingSpaces": 2,

        "reservationsEnabled": true,
        "immediateReservationEnabled": true,
        "normalReservationEnabled": true,
        "slowReservationEnabled": false,
        "maxNormalReservations": 10
      }
  auth:
    type: bearer
    token: "{{agent_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

