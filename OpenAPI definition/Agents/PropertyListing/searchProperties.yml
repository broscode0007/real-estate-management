info:
  name: searchProperties
  type: http
  seq: 7
  tags:
    - property-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/agents/properties/search"
  body:
    type: json
    data: |-
      {
        "city": "Chennai",
        "propertyType": "VILLA",
        "listingType": "SALE",
        "minPrice": 5000000,
        "maxPrice": 15000000,
        "minBedrooms": 3,
        "page": 0,
        "size": 20
      }
  auth:
    type: bearer
    token: "{{agent_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

