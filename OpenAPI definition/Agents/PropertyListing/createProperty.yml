info:
  name: createProperty
  type: http
  seq: 1
  tags:
    - property-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/agents/properties"
  headers:
    - name: Authorization
      value: ""
  body:
    type: json
    data: |-
      {
        "title": "Updated Luxury Villa",
        "description": "Recently renovated villa",

        "propertyType": "VILLA",
        "listingType": "SALE",
        "status": "ACTIVE",

        "expectedPrice": 9200000,
        "startPrice": 8500000,
        "maxPrice": 9500000,

        "address": "12 Anna Nagar West",
        "locality": "Anna Nagar",
        "city": "Chennai",
        "postalCode": "600040",
        "district": "Chennai",
        "state": "Tamil Nadu",
        "country": "India",
        

        "latitude": 13.0878,
        "longitude": 80.2101,

        "builtUpAreaSqFt": 2600,
        "carpetAreaSqFt": 2400,

        "bedrooms": 4,
        "bathrooms": 4,
        "balconies": 2,
        "parkingSpaces": 3,

        "reservationsEnabled": true,
        "immediateReservationEnabled": true,
        "normalReservationEnabled": true,
        "slowReservationEnabled": false,
        "maxNormalReservations": 15
      }
  auth:
    type: bearer
    token: "{{agent_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setGlobalEnvVar("agent_property_id", body.id);

        console.log("Saved ID");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

