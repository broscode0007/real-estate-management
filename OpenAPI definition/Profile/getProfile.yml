info:
  name: getProfile
  type: http
  seq: 1
  tags:
    - agent-profile-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/agents/profile"
  headers:
    - name: Authorization
      value: ""
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/agents/profile"
      method: GET
      headers:
        - name: Authorization
